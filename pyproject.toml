[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npfeegnet-rd"
version = "0.5.0.dev0"
description = "Fixed spectral-residual EEGNet with raw-branch demeaning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "torch>=2.2"]

[tool.setuptools]
packages = ["model", "training", "baselines"]
py-modules = ["train", "predict"]

[project.optional-dependencies]
baselines = ["scipy>=1.11,<2"]
audit = ["scipy>=1.11,<2", "matplotlib>=3.7,<4"]

[tool.setuptools.package-data]
baselines = ["*.txt", "*.json"]
